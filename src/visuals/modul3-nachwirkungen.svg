<svg width="720" height="400" viewBox="0 0 720 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nw-title nw-desc">
  <title id="nw-title">Emotionale Nachwirkungen nach Episoden</title>
  <desc id="nw-desc">Zwei Verlaufskurven zeigen, wie sich die emotionale Erholung nach Manien und nach Depressionen unterscheidet. Nach Manien folgt oft ein steiler Abfall durch Vertrauensbruch, dann langsame Erholung. Nach Depressionen folgt ein flacher, zäher Wiederaufstieg durch anhaltende Erschöpfung.</desc>

  <!-- Background -->
  <rect width="720" height="400" rx="20" fill="#FAFAF7"/>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" fill="#3d3530" font-family="DM Serif Display, serif" font-size="18" font-weight="700">Emotionale Nachwirkungen nach Episoden</text>
  <text x="360" y="56" text-anchor="middle" fill="#776c63" font-family="DM Sans, sans-serif" font-size="13">Wie sich die Beziehungsqualität nach verschiedenen Episodentypen verändert</text>

  <!-- Legend -->
  <line x1="100" y1="82" x2="128" y2="82" stroke="#3a9aa3" stroke-width="3" stroke-linecap="round"/>
  <circle cx="114" cy="82" r="4" fill="#3a9aa3"/>
  <text x="134" y="87" fill="#1a6b72" font-family="DM Sans, sans-serif" font-size="13" font-weight="600">Nach Manien</text>
  <line x1="300" y1="82" x2="328" y2="82" stroke="#8A504B" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 3"/>
  <circle cx="314" cy="82" r="4" fill="#8A504B"/>
  <text x="334" y="87" fill="#8A504B" font-family="DM Sans, sans-serif" font-size="13" font-weight="600">Nach Depressionen</text>

  <!-- Axes -->
  <line x1="70" y1="100" x2="70" y2="330" stroke="#DDD2BF" stroke-width="1.5"/>
  <line x1="70" y1="330" x2="660" y2="330" stroke="#DDD2BF" stroke-width="1.5"/>

  <!-- Y-axis labels -->
  <text x="58" y="108" fill="#94a3b8" font-size="11" text-anchor="end" font-family="DM Sans, sans-serif">Hoch</text>
  <text x="58" y="218" fill="#94a3b8" font-size="11" text-anchor="end" font-family="DM Sans, sans-serif">Mittel</text>
  <text x="58" y="328" fill="#94a3b8" font-size="11" text-anchor="end" font-family="DM Sans, sans-serif">Niedrig</text>

  <!-- Y-axis gridlines (subtle) -->
  <line x1="70" y1="215" x2="660" y2="215" stroke="#DDD2BF" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- X-axis phase labels -->
  <text x="115" y="350" fill="#B45309" font-size="12" font-weight="600" text-anchor="middle" font-family="DM Sans, sans-serif">Episode</text>
  <text x="280" y="350" fill="#776c63" font-size="12" text-anchor="middle" font-family="DM Sans, sans-serif">Wochen 1–4</text>
  <text x="440" y="350" fill="#776c63" font-size="12" text-anchor="middle" font-family="DM Sans, sans-serif">Monate 2–6</text>
  <text x="590" y="350" fill="#776c63" font-size="12" text-anchor="middle" font-family="DM Sans, sans-serif">Stabile Phase</text>

  <!-- Phase dividers -->
  <line x1="160" y1="100" x2="160" y2="330" stroke="#DDD2BF" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="360" y1="100" x2="360" y2="330" stroke="#DDD2BF" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="520" y1="100" x2="520" y2="330" stroke="#DDD2BF" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Episode band -->
  <rect x="70" y="100" width="90" height="230" fill="#B45309" opacity="0.06" rx="0"/>

  <!-- KURVE 1: Nach Manien (teal, solid) -->
  <!-- Verlauf: Stabil vor Episode → steiler Absturz (Vertrauensbruch) → langsame Erholung mit Plateau -->
  <path d="M70,140 L115,140 L160,295 L220,270 L280,245 L360,225 L440,200 L520,185 L590,178 L660,175"
    fill="none" stroke="#3a9aa3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Annotation: steiler Absturz -->
  <line x1="160" y1="295" x2="195" y2="310" stroke="#3a9aa3" stroke-width="1" opacity="0.6"/>
  <text x="197" y="314" fill="#1a6b72" font-family="DM Sans, sans-serif" font-size="11">Vertrauensbruch,</text>
  <text x="197" y="326" fill="#1a6b72" font-family="DM Sans, sans-serif" font-size="11">Schock, Wut</text>

  <!-- KURVE 2: Nach Depressionen (rose, dashed) -->
  <!-- Verlauf: Stabil vor Episode → moderater Abfall (Erschöpfung, Distanz) → sehr zähe, flache Erholung -->
  <path d="M70,155 L115,155 L160,250 L220,242 L280,235 L360,228 L440,222 L520,218 L590,215 L660,213"
    fill="none" stroke="#8A504B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 4"/>

  <!-- Annotation: flache Erholung -->
  <line x1="440" y1="222" x2="440" y2="175" stroke="#8A504B" stroke-width="1" opacity="0.5"/>
  <text x="445" y="170" fill="#8A504B" font-family="DM Sans, sans-serif" font-size="11">Zähe Erholung —</text>
  <text x="445" y="182" fill="#8A504B" font-family="DM Sans, sans-serif" font-size="11">Erschöpfung bleibt</text>

  <!-- Key insight box -->
  <rect x="70" y="365" width="580" height="0" rx="8" fill="#EAF5F5" opacity="0"/>

  <!-- Dot markers on curves -->
  <circle cx="160" cy="295" r="5" fill="#3a9aa3"/>
  <circle cx="160" cy="250" r="5" fill="#8A504B"/>
  <circle cx="660" cy="175" r="4" fill="#3a9aa3" opacity="0.7"/>
  <circle cx="660" cy="213" r="4" fill="#8A504B" opacity="0.7"/>

  <!-- Gap annotation: Erholungslücke -->
  <line x1="650" y1="175" x2="650" y2="213" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="644" y1="175" x2="656" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="644" y1="213" x2="656" y2="213" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="658" y="197" fill="#94a3b8" font-family="DM Sans, sans-serif" font-size="10">Lücke</text>

</svg>
