name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build, Lint & HTML Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: HTML Validate
        run: npm run lint:html
      - name: CSS Lint
        run: npm run lint:css

  accessibility:
    name: Accessibility Check (pa11y-ci)
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Start local server
        run: npx http-server _site -p 8080 --silent &
      - name: Wait for server to be ready
        run: npx wait-on http://localhost:8080 --timeout 30000
      - name: Run accessibility checks
        run: npm run lint:a11y

  lighthouse:
    name: Lighthouse CI (Performance, A11y, SEO)
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build site (production context so noindex is disabled)
        run: npm run build
        env:
          CONTEXT: production
      - name: Start local server
        run: npx http-server _site -p 8080 --silent &
      - name: Wait for server to be ready
        run: npx wait-on http://localhost:8080 --timeout 30000
      - name: Run Lighthouse CI
        run: npm run lint:lighthouse

  playwright-smoke:
    name: Playwright Smoke Tests
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run smoke tests
        run: npm run test:e2e

  release-audit:
    name: Release Audit (PDF manifest, internal links, SEO)
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install poppler-utils (provides pdfinfo for PDF manifest checks)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Build site
        run: npm run build
      - name: Start local server
        run: npx http-server _site -p 8080 --silent &
      - name: Wait for server to be ready
        run: npx wait-on http://localhost:8080 --timeout 30000
      - name: Run release audit (skip production-only checks)
        run: npm run audit:release:ci
        env:
          SITE_URL: http://localhost:8080
